<head>
    <meta charset="UTF-8">

    <style>
    :root {
        --1-color: #fff2d8;
        --7-color: #f2e9d4;
        --2-color: #fccdd3;
        --3-color: #fca2cf;
        --4-color: #d8f4f6;
        --5-color: #ade1eb;
        --6-color: #2a3031;
        --8-color: #f3dada;
        --9-color:#dbaec5;
    }

        body {
            font-family: 'Andale Mono', monospace;
            background-color:var(--8-color);
            text-align: center;
            padding: 10px;
        }

        h {
            font-size: 24px;
        }

        a {
            color: black;
        }

        a:hover {
            color: #fff;
        }

        .calendar {
            max-width: 600px;
            margin: 10px auto;
            padding: 10px;
            border-radius: 10px;
            align-items: center;
        }

        .days {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px; 
}

.day {
    margin: 5px; 
    padding: 0; 
    /*background-color:var(--1-color);*/
    height: 200px; 
    width: 200px; 
}

        .day-content {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            border-radius: 12px;
        }
        

        .front, .back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 12px; 
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .front {
            color: #e5cfdb;
            font-size: 30px; 
            border-radius: 15px;
        }

        .back {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 12px; 
            overflow: hidden; 
            transition: transform 0.3s;
        }

        .back img {
            max-width: 100%; 
            max-height: 100%; 
            margin-bottom: 5px; 
            cursor: pointer; 
            object-fit: contain;  
            border-radius: 12px;
        }

        .back:hover {
            transform: scale(1.1); 
        }

        .locked .day-content {
            pointer-events: none; 
        }

        .locked .front {
            background-color: #ffb997;
            color: rgb(73, 71, 71);
        }

        @media (min-width: 600px) {
            .days {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (max-width: 599px) {
            .days {
                grid-template-columns: repeat(2, 1fr); 
            }
        }



        .a2 {
            font-size: 28px;
            text-decoration: none;
            color: #d5428c;
            transition: color 0.3s ease, font-size 0.3s ease;

        }

        .a2:hover {
            color: #fca2cf;
            font-size: 32px;
            cursor: pointer;
        }
        .icon {
            position: absolute;
            font-size: 20px;
            opacity: 0;
            pointer-events: none;
            animation: fall 3s ease-in-out forwards;
        }

        .star {
            color: #96ddec;
        }

        .heart {
            color: #ef88bb;
        }
        @keyframes fall {
            0% {
                transform: translateY(0) scale(1);
                opacity: 1;
            }

            100% {
                transform: translateY(500px) scale(0.5);
                opacity: 0;
            }
        }


footer {
            text-align: center;
        }

        footer a{
            font-size: 10px;
            text-decoration: none;
            color: var(--9-color); 
            transition: color 0.3s;
        }

        footer a:hover {
            color: var(--3-color); 
        }
        p3 {
            font-size: 8px;
        }

    </style>

        function triggerIconShower(event) {
    for (let i = 0; i < 15; i++) { 
      const icon = document.createElement('div');
      icon.classList.add('icon');
    
      const iconContent = Math.random() > 0.5 ? '♥': '★';

      else{

      }

      icon.style.top = `${y}px`;
